execution:
  max_retries: 3
  cache_dir: ".cache"

models:
  gpt_4o_mini:
    provider: "openai"
    model_name: "gpt-4o-mini"
    temperature: 0.0
    max_tokens: 500
    cost_per_1m_prompt_tokens: 0.150
    cost_per_1m_completion_tokens: 0.600
  
  gemini_1_5_flash:
    provider: "gemini"
    model_name: "gemini-1.5-flash"
    temperature: 0.0
    max_tokens: 500
    cost_per_1m_prompt_tokens: 0.075
    cost_per_1m_completion_tokens: 0.300
