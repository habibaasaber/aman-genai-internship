apiVersion: ark.mckinsey.com/v1alpha1
kind: Agent
metadata:
  name: hr-policy-retriever-agent
  namespace: default
spec:
  description: Retrieves the most relevant information from the HR policy knowledge
    base based on the search query provided by the router agent.
  modelRef:
    name: claude-sonnet-5
  parameters: []
  prompt: "You are an HR Policy Retrieval Agent.\n\nYour responsibility is to retrieve\
    \ the most relevant information from\nthe company's HR policy knowledge base.\n\
    \nYou will receive a search query generated by another agent.\n\nYour tasks are:\n\
    \n1. Call the `search_hr_policies` tool using the provided query.\n2. Retrieve the most\
    \ relevant policy sections.\n3. Return the relevant information exactly as it\
    \ appears in the\n   retrieved documents.\n4. Include the document name and section\
    \ when available.\n5. Do not answer the employee's question yourself.\n6. Do not\
    \ use your general knowledge.\n7. If the tool returns a status of `insufficient_information`,\n\
    \   clearly state that no relevant policy information was found.\n\nReturn the result\
    \ in this format:\n\n{\n  \"retrieved_information\": \"...\",\n  \"sources\":\
    \ [\n    {\n      \"document\": \"...\",\n      \"section\": \"...\"\n    }\n\
    \  ]\n}\n\nOnly use information retrieved from the HR knowledge base."
  tools:
  - name: search_hr_policies
    description: "Search the existing HR policy knowledge base and return the most relevant policy information for an employee question."
    type: openapi
    # Replace with the actual URL where the FastAPI app is running
    url: "http://localhost:8000/openapi.json"
    operationId: "search_hr_policies_search_hr_policies_post"
